# Yandex Station Lite Voice Triggers Configuration
#
# Format: TRIGGER_PATTERN | ACTION | DEFAULT_TTS_RESPONSE
# If TRIGGER_PATTERN contains '+', all sub-words must be present in the spoken phrase.
# Matching is case-insensitive.
#
# Examples:
#   ультракилл       -> matches "включи ультракилл", "запусти на ноуте ультракилл"
#   ноут+ютуб        -> matches "включи на ноуте ютуб", "открой на ноуте ютуб"
#   выруби+моник     -> matches "алиса выруби моник", "выруби моник"

# --- Gaming ---
ультракилл | ultrakill | Запускаю Ультракилл на ноуте! Приятной игры!
ultrakill  | ultrakill | Запускаю Ультракилл на ноуте! Приятной игры!

# --- Browser & Media ---
ноут+ютуб    | youtube | Открываю Ютуб на ноуте!
ноутбук+ютуб | youtube | Открываю Ютуб на ноуте!
ноут+youtube | youtube | Открываю Ютуб на ноуте!

# --- Display Management ---
выруби+моник   | mon_off | Вырубила монитор!
выключи+моник  | mon_off | Вырубила монитор!
потуши+моник   | mon_off | Вырубила монитор!
выруби+экран   | mon_off | Вырубила экран!
выключи+экран  | mon_off | Вырубила экран!
вруби+моник    | mon_on  | Врубила монитор!
включи+моник   | mon_on  | Врубила монитор!
вруби+экран    | mon_on  | Врубила экран!
включи+экран   | mon_on  | Врубила экран!

# --- System & Fun ---
заблокируй+ноут   | lock   | Ноутбук заблокирован!
заблокируй+ноутбук| lock   | Ноутбук заблокирован!
прикол            | prikol | Прикол запущен!
включи+прикол     | prikol | Прикол запущен!
запусти+прикол    | prikol | Прикол запущен!
